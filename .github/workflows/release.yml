name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Builds libAura3D.a (+ public headers) for Linux and Android, and the WASM
# pkg/ output, then attaches one archive per platform to a GitHub Release.
# These are separate binaries for separate toolchains/ABIs -- there is no
# single artifact that covers all three (see docs/10-platform-builds.md).

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CHANGELOG section
        # Pulls the "## [X.Y.Z]" ... section up to the next "## [" heading
        # (or EOF) out of CHANGELOG.md, keyed off the pushed tag (v0.1.0 ->
        # 0.1.0)
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "❌  No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_notes.md \
            --draft

  linux-release:
    name: Package Linux
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build/linux/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DAURA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/linux/release --parallel

      - name: Install
        run: cmake --install build/linux/release --prefix stage/aura3d-linux-x86_64

      - name: Merge wma/ink into a self-contained static library
        # libwma.a and libink.a in this image are themselves static, so fold
        # their object files into libAura3D.a: a consumer of the release
        # archive then only needs Vulkan/OpenGL/Threads (system libraries,
        # not bundled) rather than separately building wma/ink for their
        # platform. Extract each archive into its own subdirectory first so
        # identically-named object files (e.g. two libraries each with a
        # "Utils.cpp.o") don't collide when re-archived together.
        run: |
          FAT_LIB="$(pwd)/stage/aura3d-linux-x86_64/lib/libAura3D.a"
          WMA_LIB="$(find /usr/local -name 'libwma.a' | head -1)"
          INK_LIB="$(find /usr/local -name 'libink.a' | head -1)"

          if [[ -z "$WMA_LIB" || -z "$INK_LIB" ]]; then
            echo "❌  libwma.a/libink.a not found under /usr/local" >&2
            exit 1
          fi

          MERGE_DIR="$(mktemp -d)"
          n=0
          for lib in "$FAT_LIB" "$WMA_LIB" "$INK_LIB"; do
            dir="$MERGE_DIR/$n"
            mkdir -p "$dir"
            ar -x --output="$dir" "$lib"
            n=$((n + 1))
          done

          ar -qc "$FAT_LIB.merged" $(find "$MERGE_DIR" -name '*.o')
          ranlib "$FAT_LIB.merged"
          mv "$FAT_LIB.merged" "$FAT_LIB"

          # This staged Aura3DConfig.cmake no longer needs to find wma/ink
          # separately -- their code is now inside libAura3D.a. Leave
          # Vulkan/OpenGL/Threads find_dependency calls alone; those stay
          # external. Does not touch cmake/Aura3DConfig.cmake.in, so a normal
          # (non-release) `cmake --install` elsewhere is unaffected.
          CONFIG="stage/aura3d-linux-x86_64/lib/cmake/Aura3D/Aura3DConfig.cmake"
          sed -i '/find_dependency(wma)/d;/find_dependency(ink)/d' "$CONFIG"

      - name: Package
        run: |
          tar -C stage -czf aura3d-${{ github.ref_name }}-linux-x86_64.tar.gz \
            aura3d-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: aura3d-${{ github.ref_name }}-linux-x86_64.tar.gz
          retention-days: 1

  android-release:
    name: Package Android
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # Mirrors ci.yml's android-build job -- see its Configure step for why
        # CMAKE_PREFIX_PATH/CMAKE_FIND_ROOT_PATH_MODE_PACKAGE are set this way.
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DANDROID_STL=c++_shared
          -DCMAKE_BUILD_TYPE=Release
          -DAURA_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="/usr/local/android;/usr/local"
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: cmake --build build-android --parallel

      - name: Stage
        # cmake/Install.cmake skips install() entirely for Android (the .a
        # is meant to be linked into a host app's own build, not installed
        # to a system prefix), so stage the static lib + public headers by
        # hand instead of `cmake --install`.
        run: |
          STAGE="stage/aura3d-android-arm64-v8a"
          mkdir -p "$STAGE/lib"
          cp build-android/libAura3D.a "$STAGE/lib/"
          cp -r engine/include "$STAGE/include"

      - name: Merge wma/ink into a self-contained static library
        # Same reasoning as the linux-release job: fold the (also static)
        # arm64-v8a libwma.a/libink.a into libAura3D.a so embedding this
        # release doesn't also require building wma/ink for Android. Use the
        # NDK's own llvm-ar/llvm-ranlib rather than the host's, since these
        # are arm64 ELF objects.
        run: |
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          FAT_LIB="$(pwd)/stage/aura3d-android-arm64-v8a/lib/libAura3D.a"
          WMA_LIB="$(find /usr/local/android -name 'libwma.a' | head -1)"
          INK_LIB="$(find /usr/local/android -name 'libink.a' | head -1)"

          if [[ -z "$WMA_LIB" || -z "$INK_LIB" ]]; then
            echo "❌  libwma.a/libink.a not found under /usr/local/android" >&2
            exit 1
          fi

          MERGE_DIR="$(mktemp -d)"
          n=0
          for lib in "$FAT_LIB" "$WMA_LIB" "$INK_LIB"; do
            dir="$MERGE_DIR/$n"
            mkdir -p "$dir"
            "$LLVM_BIN/llvm-ar" -x --output="$dir" "$lib"
            n=$((n + 1))
          done

          "$LLVM_BIN/llvm-ar" -qc "$FAT_LIB.merged" $(find "$MERGE_DIR" -name '*.o')
          "$LLVM_BIN/llvm-ranlib" "$FAT_LIB.merged"
          mv "$FAT_LIB.merged" "$FAT_LIB"

      - name: Package
        run: |
          tar -C stage -czf aura3d-${{ github.ref_name }}-android-arm64-v8a.tar.gz \
            aura3d-android-arm64-v8a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: aura3d-${{ github.ref_name }}-android-arm64-v8a.tar.gz
          retention-days: 1

  wasm-release:
    name: Package WASM
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # Same nlohmann_json fix as ci.yml's wasm-build job -- see its
        # Configure step comment.
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="/usr/local/wasm;/usr/local" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build-wasm --parallel

      - name: Stage
        run: |
          STAGE="stage/aura3d-wasm"
          mkdir -p "$STAGE"
          cp -r build-wasm/pkg "$STAGE/pkg"
          cp index.html "$STAGE/"

      - name: Package
        run: |
          tar -C stage -czf aura3d-${{ github.ref_name }}-wasm.tar.gz aura3d-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: aura3d-${{ github.ref_name }}-wasm.tar.gz
          retention-days: 1

  publish-release:
    name: Publish release
    needs: [linux-release, android-release, wasm-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/*/*.tar.gz \
            --repo "${{ github.repository }}"
          gh release edit "${{ github.ref_name }}" --draft=false \
            --repo "${{ github.repository }}"
