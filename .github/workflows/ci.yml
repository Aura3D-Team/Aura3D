name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # No GPU on the runner: Vulkan/OpenGL still build fine (headers +
        # loader libs only, no device needed to link), and this also
        # exercises the real GLSL -> SPIR-V compile via glslc/aura_compile_shaders
        # as part of the Sandbox build. Nothing in the test suite touches a
        # live GL context or VkDevice, so CTest stays GPU-free.
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DAURA_BUILD_SANDBOX=ON
          -DAURA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  wasm-build:
    name: WASM (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # continue-on-error: true
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DAURA_BUILD_TESTS=OFF

      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build-wasm --parallel

  android-build:
    name: Android (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # continue-on-error: true
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # Mirrors CMakePresets.json's "android" preset (ABI, platform level,
        # STL) rather than using it directly, since that preset's
        # CMAKE_PREFIX_PATH is wired through $env{LOCAL_PREFIX}, which isn't
        # set to anything useful for cross-compiled deps here.
        run: >
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DANDROID_STL=c++_shared
          -DCMAKE_BUILD_TYPE=Release
          -DAURA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-android --parallel
