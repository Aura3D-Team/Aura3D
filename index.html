<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura3D</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      id must stay "canvas": SDL3's Emscripten video backend looks the
      canvas up by the CSS selector "#canvas" independently of Module.canvas
      below (that override only affects the JS/Emscripten side, not SDL3's
      own emscripten_webgl_create_context call)
    -->
    <canvas id="canvas"></canvas>
    <script>
      /*
       * Emscripten generates a UMD module (not an ES module) by default.
       * We load it via a classic <script> tag; the module self-initialises.
       */
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener('webglcontextlost', function(e) {
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        onRuntimeInitialized: function() {
          console.info('[Aura3D] WASM runtime initialised.');
        },
        printErr: function(text) {
          console.error('[Aura3D]', text);
        }
      };
    </script>
    <!-- Emscripten-generated JS loader (output to pkg/ by CMake) -->
    <script src="pkg/Aura3D.js"></script>
  </body>
</html>
