plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aura3d.sandbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aura3d.sandbox'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments(
                    "-DAURA3D_ROOT=${rootProject.projectDir}/..",
                    "-DANDROID_STL=c++_shared"
                )

                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {}
        debug {}
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {}