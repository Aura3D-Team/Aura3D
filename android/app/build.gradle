plugins {
    id 'com.android.application'
}

// Pinned to the NDK version actually installed in this environment -- without
// this, AGP defaults to whatever side-by-side NDK version it prefers and
// tries to auto-download it, which fails wherever the SDK directory isn't
// writable (e.g. a shared/read-only SDK install).
//
// Must match the NDK that scripts/build_android.sh uses (via
// $ANDROID_NDK_HOME) to build the prebuilt wma/ink/SDL3 static libs this app
// links against otherwise the app's own build (this file) and its
// dependencies are built with different toolchains. It also needs to be NDK
// r28+: 16 KB ELF page alignment only became the linker default starting in
// r28, and anything built with r27 (libmain.so *and* the bundled
// libc++_shared.so) fails Android's 16 KB-page compatibility check.
def ndkVersionPinned = "28.0.13004108"

// wma/ink/SDL3 for Android are prebuilt outside this Gradle project (see
// scripts/build_android.sh) and installed under a single prefix; forward it
// to CMake so find_package() can locate them. gradle.properties sets a
// default; -PANDROID_DEPS_PREFIX=... on the command line overrides it.
def androidDepsPrefix = project.findProperty('ANDROID_DEPS_PREFIX') ?: '/usr/local'

android {
    namespace 'com.aura3d.sandbox'
    compileSdk 35
    // Pinned for the same reason as ndkVersion above: AGP's default for
    // compileSdk 35 wants build-tools 34.0.0, which isn't installed here
    // (35.0.0 is) and can't be auto-downloaded into a read-only SDK dir.
    buildToolsVersion "35.0.0"
    ndkVersion ndkVersionPinned

    defaultConfig {
        applicationId 'com.aura3d.sandbox'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments(
                    "-DAURA3D_ROOT=${rootProject.projectDir}/..",
                    "-DANDROID_STL=c++_shared",
                    // ink/wma/Aura3D share the prefix and differ by ABI tag;
                    // SDL3 is still per-platform, hence the /android entry too.
                    "-DCMAKE_PREFIX_PATH=${androidDepsPrefix};${androidDepsPrefix}/android",
                    "-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH"
                )

                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {}
        debug {}
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}

dependencies {}